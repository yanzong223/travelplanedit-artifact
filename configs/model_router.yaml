version: 1

model_sets:
  main6:
    description: "Non-strict closed-source main experiment set: three open small/mid models plus three SOTA large models."
    groups:
      small_open_models:
        - qwen3_30b_a3b_instruct_2507
        - qwen3_5_35b_a3b
        - qwen3_32b
        - glm_4_5_air
        - minimax_m2
      sota_large_models:
        - gpt_5_4
        - gemini_3_1_pro
        - gemini_3_1_pro_preview
        - deepseek_v4_pro
  mid3:
    description: "Three medium-size/open main experiment models for partial runs."
    groups:
      small_open_models:
        - qwen3_30b_a3b_instruct_2507
        - qwen3_5_35b_a3b
        - qwen3_32b
        - glm_4_5_air
        - minimax_m2

models:
  qwen3_30b_a3b_instruct_2507:
    model: "Qwen3-30B-A3B-Instruct-2507"
    provider: "dmxapi"
    family: "qwen"
    group: "small_open_models"
    open_weight: true
    capabilities:
      tools: true
      structured_output: true
      thinking: true
      thinking_budget: true
    request_overrides:
      extra_body:
        enable_thinking: false

  qwen3_vl_8b_instruct:
    model: "qwen3-vl-8b-instruct"
    provider: "dmxapi"
    family: "qwen"
    group: "small_open_models"
    open_weight: true
    capabilities:
      tools: true
      structured_output: true
      thinking: false
      thinking_budget: false
    request_overrides: {}

  qwen3_6_35b_a3b:
    model: "qwen3.6-35b-a3b"
    provider: "dmxapi"
    family: "qwen"
    group: "small_open_models"
    open_weight: true
    capabilities:
      tools: true
      structured_output: true
      thinking: true
      thinking_budget: true
    request_overrides:
      extra_body:
        enable_thinking: true
        thinking_budget: 8192
    notes: "DMXAPI Qwen3.6 thinking-mode route."

  qwen3_5_35b_a3b:
    model: "qwen3.5-35b-a3b"
    provider: "dmxapi"
    family: "qwen"
    group: "small_open_models"
    open_weight: true
    capabilities:
      tools: true
      structured_output: true
