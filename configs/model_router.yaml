    request_overrides:
      extra_body:
        enable_thinking: true
        thinking_budget: 8192
    notes: "DMXAPI Qwen3.5 35B A3B thinking-mode route."

  qwen3_32b:
    model: "qwen3-32b"
    provider: "dmxapi"
    family: "qwen"
    group: "small_open_models"
    open_weight: true
    capabilities:
      tools: true
      structured_output: true
      thinking: true
      thinking_budget: true
    request_overrides:
      extra_body:
        enable_thinking: true
        thinking_budget: 8192
    notes: "DMXAPI Qwen3-32B thinking-mode route."

  qwen3_6_plus:
    model: "qwen3.6-plus"
    provider: "dmxapi"
    family: "qwen"
    group: "sota_large_models"
    open_weight: false
    capabilities:
      tools: true
      structured_output: true
      thinking: true
      thinking_budget: true
    request_overrides:
      extra_body:
