(structural, temporal, overflow):
  eligible_for_edit: true
  templates:
    - template: "确保{day}在{time}前结束所有活动"
      params:
        day: ["第一天", "第二天"]
        time: ["18:00", "19:00", "20:00"]
      constraint_type: "time_limit"
      city_constraint: "target_city_only"
      description: "限制某一天的结束时间（通常触发重排）"

    - template: "增加{poi}到行程中，要求所有景点之间的交通时间不超过{duration}"
      params:
        duration: ["30分钟", "1小时", "1.5小时"]
      poi_source: "attractions"
      constraint_type: "travel_time_constraint"
      city_constraint: "target_city_only"
      description: "交通时间约束过紧（可达性）"
      soft_family: "route_compactness"
      soft_facet: "travel_time"
      supported_edit_modes: ["addition"]
      soft_intensity: "medium"
      origin_requirement: "absent"
      surface_variants:
        - "想把{poi}也加进行程里，但路上别花太多时间，景点之间的交通最好别超过{duration}"
        - "把{poi}安排进去可以，不过我希望各个景点之间通勤快一点，尽量控制在{duration}内"
        - "想去{poi}，同时也想让景点之间少折腾，交通时间最好压到{duration}以内"
        - "把{poi}加进来吧，但我不想把时间都耗在路上，景点之间通勤别超过{duration}"

    - template: "增加{poi}到行程中，同时希望所有景点之间的交通时间尽可能少，最好不超过{duration}"
      params:
        duration: ["30分钟", "1小时", "1.5小时"]
      poi_source: "attractions"
      constraint_type: "travel_time_constraint"
      city_constraint: "target_city_only"
      description: "更强的交通时间压缩偏好"
      soft_family: "route_compactness"
      soft_facet: "travel_time"
      supported_edit_modes: ["strengthen"]
      soft_intensity: "strong"
      origin_requirement: "present"
      surface_variants:
        - "想把{poi}也安排上，而且最好别来回折腾，景点之间的交通时间尽量压到{duration}以内"
