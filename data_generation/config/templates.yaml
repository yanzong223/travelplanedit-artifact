# =========================
# Common configuration
# =========================

poi_source_types:
  attractions: "从attractions数据库采样"
  existing_attractions: "从origin plan中已有的景点选择"
  restaurants: "从restaurants数据库采样"
  accommodations: "从accommodations数据库采样"
  all: "从所有POI类型采样"

city_constraint_types:
  target_city_only: "只能使用origin plan的target_city的POI"
  allow_nearby_city: "允许使用target_city附近的城市POI"

template_instructions: |
  1. {poi}: 从POI数据库中随机采样一个景点
  2. {poi1}, {poi2}: 采样多个不同的景点
  3. {target_city}: 自动填充为origin plan的target_city
  4. {start_city}: 自动填充为origin plan的start_city
  5. {day}: 填充为"第一天"、"第二天"等
  6. {time}: 填充为具体时间（如"18:00"）
  7. {duration}: 填充为时长（如"2小时"）
  8. {budget}: 填充为预算金额
  9. {poi_type}: 填充为景点类型
  10. {day_count}: 填充为天数
