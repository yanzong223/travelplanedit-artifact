# Query Templates Configuration
# Query模板配置，用于生成edit query
# 重要约束：
# 1. 模板必须聚焦于target_city，不提出更换城市
# 2. {poi}占位符将从POI数据库中采样真实POI
# 3. 至少包含一个可判定的硬约束
# Parameter模板准入规则：
# 1. 仅允许约束单个activity/poi的单一属性（例如duration、单段交通时长、单项费用）
# 2. 出现全局词（如所有/总计/整天/任意两个/之前结束/安排在...之间）应归为structural
# 3. 出现结构动作词（如增加/删除/替换/重排/安排/改为交通方式）应归为structural

# =========================
# Parameter-level templates
# =========================

(parameter, temporal, overflow):
  eligible_for_edit: true
  templates:
    - template: "把{poi}的游玩时间限制在{duration}以内"
      params:
        duration: ["1小时", "2小时", "3小时"]
      poi_source: "attractions"
      constraint_type: "duration_limit"
      city_constraint: "target_city_only"
      description: "限制单个景点的游玩时长"

(parameter, resource, overflow):
  eligible_for_edit: true
  templates:
    - template: "预算上限可以放宽到{budget}元左右，尽量充分利用这部分预算来优化体验"
      params:
        budget: [500, 800, 1000, 1200, 1500, 2000, 2500, 3000]
      constraint_type: "budget_cap_preference"
      city_constraint: "target_city_only"
      description: "上调预算上限，并鼓励充分利用新增预算优化体验"

    - template: "如果更好安排的话，总预算上调到{budget}元也可以，尽量把预算用足一点"
      params:
        budget: [500, 800, 1000, 1200, 1500, 2000, 2500, 3000]
      constraint_type: "budget_target_update"
      city_constraint: "target_city_only"
      description: "上调预算目标，并强调充分利用预算"

